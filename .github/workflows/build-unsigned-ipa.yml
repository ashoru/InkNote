name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release as well'
        required: false
        default: true
        type: boolean

# Build only needs to read the repository. Release publishing happens in a
# separate job that elevates permissions, so a build script can never write
# to the repository by mistake.
permissions:
  contents: read

concurrency:
  group: inknote-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('InkNote.xcodeproj/project.pbxproj').read_text(encoding='utf-8')
          ver_m = re.search(r'MARKETING_VERSION\s*=\s*([0-9.]+);', text)
          build_m = re.search(r'CURRENT_PROJECT_VERSION\s*=\s*(\d+);', text)
          if not ver_m or not build_m:
              raise SystemExit('Unable to read MARKETING_VERSION/CURRENT_PROJECT_VERSION from project.pbxproj')
          version = ver_m.group(1)
          build = build_m.group(1)
          ipa = f'InkNote-{version}-build{build}-unsigned.ipa'
          tag = f'v{version}-build{build}'
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as f:
              f.write(f'version={version}\n')
              f.write(f'build={build}\n')
              f.write(f'ipa={ipa}\n')
              f.write(f'tag={tag}\n')
          print(f'Building InkNote {version} (build {build})')
          PY

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          python3 tools/generate_project.py

      - name: Build unsigned Release
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project InkNote.xcodeproj \
            -scheme InkNote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION='${{ steps.version.outputs.version }}' \
            CURRENT_PROJECT_VERSION='${{ steps.version.outputs.build }}' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee xcodebuild.log

      - name: Verify built app
        shell: bash
        run: |
          set -euo pipefail
          APP='build/Build/Products/Release-iphoneos/InkNote.app'
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/InkNote"
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILT_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BUILT_BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          BUILT_MINOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "Built version: $BUILT_VERSION ($BUILT_BUILD), bundle: $BUILT_BUNDLE, minOS: $BUILT_MINOS"
          test "$BUILT_VERSION" = '${{ steps.version.outputs.version }}'
          test "$BUILT_BUILD" = '${{ steps.version.outputs.build }}'
          test "$BUILT_BUNDLE" = 'com.ashoru.inknote'
          test "$BUILT_MINOS" = '18.0'

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/InkNote.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload '${{ steps.version.outputs.ipa }}'
          unzip -t '${{ steps.version.outputs.ipa }}'
          shasum -a 256 '${{ steps.version.outputs.ipa }}' > '${{ steps.version.outputs.ipa }}.sha256'
          ls -lh '${{ steps.version.outputs.ipa }}'
          cat '${{ steps.version.outputs.ipa }}.sha256'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: InkNote-${{ steps.version.outputs.version }}-build${{ steps.version.outputs.build }}-unsigned
          path: |
            ${{ steps.version.outputs.ipa }}
            ${{ steps.version.outputs.ipa }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: InkNote-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build-ipa
    # Push builds stay test-only: they upload the artifact and never create a
    # Release. Publishing happens on manual dispatch or on a pushed tag.
    if: >
      github.event_name == 'workflow_dispatch' && inputs.publish_release
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('InkNote.xcodeproj/project.pbxproj').read_text(encoding='utf-8')
          ver_m = re.search(r'MARKETING_VERSION\s*=\s*([0-9.]+);', text)
          build_m = re.search(r'CURRENT_PROJECT_VERSION\s*=\s*(\d+);', text)
          if not ver_m or not build_m:
              raise SystemExit('Unable to read MARKETING_VERSION/CURRENT_PROJECT_VERSION from project.pbxproj')
          version = ver_m.group(1)
          build = build_m.group(1)
          ipa = f'InkNote-{version}-build{build}-unsigned.ipa'
          tag = f'v{version}-build{build}'
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as f:
              f.write(f'version={version}\n')
              f.write(f'build={build}\n')
              f.write(f'ipa={ipa}\n')
              f.write(f'tag={tag}\n')
          PY

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: InkNote-${{ steps.version.outputs.version }}-build${{ steps.version.outputs.build }}-unsigned

      - name: Skip duplicate release
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo ashoru/InkNote >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          version = '${{ steps.version.outputs.version }}'
          build = '${{ steps.version.outputs.build }}'
          lines = [
              f'# InkNote {version} (build {build})',
              '',
              'Personal-use handwriting note app, first release.',
              'Unsigned IPA: install it only after signing it yourself, for example in Xcode with your own Apple ID, or with a sideloading tool you trust. Downloading the unsigned IPA alone does not install it on a device.',
              '',
              'Scope in this build: canonical stroke model v1, notebook management, PencilKit handwriting, PDF annotation and rendered export, .note import validation. NAS sync, audio transcription, handwriting recognition and handwritten formula recognition are interface-only in this build.',
              '',
              'Verify: download the .sha256 file in the same release and run `shasum -a 256 -c <file>.sha256`.',
          ]
          Path('release_body.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Publish GitHub Release
        if: steps.guard.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: InkNote ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build }})
          body_path: release_body.md
          files: |
            ${{ steps.version.outputs.ipa }}
            ${{ steps.version.outputs.ipa }}.sha256
          make_latest: true
